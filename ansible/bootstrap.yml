---
- name: Initial config
  hosts: servers_group
  become: true
  vars:
    ansible_user: "{{ default_account }}"
    ansible_port: 22

  tasks:
    - name: Create new admin account
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: sudo
        append: true
        create_home: true
        shell: /bin/bash
        password: "{{ hashed_password }}"
        update_password: always

    - name: Copy SSH key
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        state: present
        key: "{{ admin_ssh_public_key }}"
